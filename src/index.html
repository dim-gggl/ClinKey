<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinkey - Your password buddy</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ClinKey" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <!-- Inclusion of the 'Inter' font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body data-theme="dark"> <!-- Dark theme by default -->

    <div class="app-container">
        <div class="app-content">
            <!-- Header -->
            <header class="header">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <h1 class="header-title">Clinkey</h1>
                <p class="header-subtitle">Your password buddy</p>
            </header>

            <main>
                <!-- Display of the generated password -->
                <div class="password-display-wrapper">
                    <textarea id="password-display" readonly rows="8"></textarea>
                    <button id="copy-button" title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
                <div id="copy-feedback"></div>

                <!-- Generation options -->
                <section class="options-section">
                    <fieldset style="border:none;">
                        <legend class="options-legend">How twisted ?</legend>
                        <div class="radio-group">
                            <div>
                                <input type="radio" name="password_type" value="normal" id="type_normal">
                                <label for="type_normal" class="radio-label">
                                    <span class="radio-label-title">Vanilla</Var></span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="password_type" value="strong" id="type_strong" checked>
                                <label for="type_strong" class="radio-label">
                                    <span class="radio-label-title">Strong</span>
                                </label>
                            </div>
                            <div>
                                <input type="radio" name="password_type" value="super_strong" id="type_super_strong">
                                <label for="type_super_strong" class="radio-label">
                                    <span class="radio-label-title">Super twisted</span>
                                </label>
                            </div>
                        </div>
                    </fieldset>

                    <!-- Advanced options -->
                    <div class="advanced-options">
                        <div class="slider-container">
                            <label for="length-slider" class="option-label">
                                <span>How long ?</span>
                                <span id="length-value">16</span>
                            </label>
                            <input type="range" id="length-slider" min="8" max="128" value="16">
                        </div>
                        <div class="quantity-container">
                            <label for="quantity-input" class="option-label"><span>How many ?</span></label>
                            <input type="number" id="quantity-input" min="1" max="70" value="1">
                        </div>
                    </div>
                </section>

                <!-- Generation button -->
                <button id="generate-button" class="action-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                    <span>Generate</span>
                </button>
            </main>
        </div>
        
        <!-- Footer -->
        <footer class="footer">
            <p>Clinkey</p>
            <button id="theme-toggle" title="Change theme">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </footer>
    </div>

    <script src="./static/js/script.js"></script>
</body>
</html>
